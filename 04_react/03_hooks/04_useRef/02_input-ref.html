<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.development.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="text/babel">
            const { useState, useRef, useEffect } = React;

            function LoginComponent() {
                const [form, setForm] = useState({
                    username: "",
                    password: "",
                });
                const usernameRef = useRef();

                /**
                 * 렌더링이 끝나기 전에는 실제 DOM요소가 아직 준비되지 않았을 수 있으므로,
                 * DOM을 직접 다루는 코드는 useEffect안에서 처리하는 것이 자연스럽다
                 * 
                 * state: 화면에 출력되고 변경 즉기 UI가 달라져야 하는 값
                 * Ref: 렌더링 사이에 기억해야 하지만, 변경만으로 리렌더링할 필요가 없는 값을 저장 ex)input 포커스, 스크롤 이동, 실제 DOM요소 기능을 호출할때
                */
                useEffect(() => {
                    console.log("Login 컴포넌트 마운트되었습니다");
                    console.log(usernameRef.current);
                    usernameRef.current.focus();
                }, []);

                const onClickHandler = () => {
                    alert(
                        `username: ${form.username}, password: ${form.password}`,
                    );
                    setForm({ username: "", password: "" });
                    usernameRef.current.focus();
                };

                const onChangeHandler = (e) => {
                    setForm({
                        ...form,
                        [e.target.name]: e.target.value,
                    });
                };

                return (
                    <>
                        <input
                            type="text"
                            value={form.username}
                            name="username"
                            onChange={onChangeHandler}
                            ref={usernameRef}
                        />
                        <br />
                        <input
                            type="password"
                            value={form.password}
                            name="password"
                            onChange={onChangeHandler}
                        />
                        <br />
                        <button onClick={onClickHandler}>로그인</button>
                    </>
                );
            }
            function App() {
                return (
                    <>
                        <LoginComponent />
                    </>
                );
            }
            ReactDOM.createRoot(document.getElementById("root")).render(
                <App />,
            );
        </script>
    </body>
</html>
