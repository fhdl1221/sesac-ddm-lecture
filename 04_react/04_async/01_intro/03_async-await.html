<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h1>콘솔을 확인하세요</h1>
        <script>
            function increase(number) {
                const promise = new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const result = number + 10;
                        if (result > 30) {
                            const error = new Error("숫자가 너무 큽니다");
                            // 에러와 함께 실패 처리 -> .catch 매개변수로 전달
                            return reject(error);
                        }
                        // 계산된 결과와 함께 성공처리 -> .then 매개변수로 전달
                        resolve(result);
                    }, 1000);
                });
                return promise;
            }

            async function run() {
                try {
                    console.log("작업 시작...");

                    // await: increase(0) Promise가 끝날 때까지 '기다렸다가',
                    // resolve된 결과값을 result 변수에 할당한다
                    let result = await increase(0);
                    console.log(result);

                    result = await increase(result);
                    console.log(result);

                    result = await increase(result);
                    console.log(result);

                    result = await increase(result);
                    console.log(result);
                } catch (error) {
                    // try 블록 안에서 promise가 reject되면 catch 블록이 실행된다
                    console.error(error);
                }
                console.log("작업이 완료되었습니다");
            }

            run();
        </script>
    </body>
</html>
